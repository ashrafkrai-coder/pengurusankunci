<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengurusan Kunci SMK Taman Medan</title>
<meta name="theme-color" content="#f4f7fc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- CSS dijana oleh Tailwind (npm run build:css); ikon Lucide 1.77.0 dihos sendiri -->
<link rel="stylesheet" href="tailwind.css">
<script src="vendor/lucide.min.js"></script>
<style>
  :root{
    --bg:#f4f7fc; --card:#ffffff; --line:#e6ecf5; --ink:#0f1b33; --muted:#66748f; --soft:#eef3fb;
    --brand:#1d4ed8; --brand-2:#3b82f6; --brand-soft:#e0eaff;
    --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
    --nav-h:68px;
  }
  html{background:var(--bg)}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);
    -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  .muted{color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,27,51,.04),0 6px 16px -12px rgba(15,27,51,.18)}
  .soft{background:var(--soft)}
  .fld{background:var(--soft);border:1px solid var(--line);transition:border-color .15s,box-shadow .15s,background .15s}
  .fld:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 4px rgba(29,78,216,.12)}
  input,select{color:var(--ink);outline:none}
  input::placeholder{color:#9aa6bd}
  .btn-on{background:linear-gradient(135deg,var(--brand-2) 0%,var(--brand) 100%);color:#fff;box-shadow:0 8px 18px -8px rgba(29,78,216,.7)}
  .hero{background:radial-gradient(120% 140% at 100% 0%,#60a5fa 0%,transparent 55%),linear-gradient(140deg,#2563eb 0%,#1d4ed8 55%,#1e3a8a 100%);color:#fff}
  .hero .m{color:rgba(255,255,255,.75)}
  .glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18)}
  .topbar{background:rgba(244,247,252,.82);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px)}
  .navbar{background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line)}
  .nav-item{color:#8a96ad}
  .nav-item.on{color:var(--brand)}
  .nav-item.on .nav-ic{background:var(--brand-soft)}
  .chip{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;flex:none}
  .t-use{background:var(--brand-soft);color:var(--brand)}
  .t-ok{background:var(--ok-soft);color:var(--ok)}
  .t-warn{background:var(--warn-soft);color:var(--warn)}
  .t-bad{background:var(--bad-soft);color:var(--bad)}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
  .spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .pulse-dot{animation:pd 1.8s ease-in-out infinite}@keyframes pd{0%,100%{opacity:1}50%{opacity:.3}}
  .fade{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sheet-in{animation:up .25s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  .press{transition:transform .12s ease}.press:active{transform:scale(.97)}
  .auth-top{background:radial-gradient(90% 120% at 100% 0%,#60a5fa 0%,transparent 60%),linear-gradient(150deg,#2563eb 0%,#1d4ed8 55%,#1e3a8a 100%)}
</style>
</head>
<body>

<!-- ================= APP ================= -->
<div id="app" class="min-h-[100dvh]" style="padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)">

  <!-- Bar atas -->
  <header class="topbar sticky top-0 z-10" style="padding-top:env(safe-area-inset-top)">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl btn-on flex items-center justify-center flex-none"><i data-lucide="key-round" class="w-5 h-5"></i></div>
      <div class="min-w-0 flex-1">
        <h1 class="text-[16px] font-bold leading-tight truncate">Pengurusan Kunci</h1>
        <p class="text-[12px] muted font-medium leading-tight truncate">SMK Taman Medan</p>
      </div>
      <button id="btnRefresh" class="press flex-none w-10 h-10 rounded-full card flex items-center justify-center" aria-label="Muat Semula"><i data-lucide="refresh-cw" class="w-[18px] h-[18px]"></i></button>
      <button id="btnAvatar" class="press flex-none w-10 h-10 rounded-full btn-on flex items-center justify-center text-[13px] font-bold" aria-label="Akaun">?</button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 space-y-4">

    <!-- Salam: lebar penuh supaya nama panjang tidak terpotong -->
    <div class="pt-1 min-w-0">
      <p id="salam" class="text-[13px] muted font-medium leading-tight">Selamat datang</p>
      <p id="namaSalam" class="text-[20px] font-bold leading-snug mt-0.5 line-clamp-2 break-words"></p>
    </div>

    <div id="amaran" class="hidden fade text-[13px] px-4 py-3 rounded-2xl flex items-start gap-2" style="background:var(--bad-soft);color:var(--bad)"></div>

    <!-- ===== Tab: Status ===== -->
    <section id="tabStatus" class="space-y-4">
      <!-- Kad ringkasan -->
      <div class="hero rounded-[28px] p-5 overflow-hidden relative">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="text-[13px] m font-medium">Kunci sedang digunakan</p>
            <p class="mt-1 leading-none"><span id="sumLuar" class="text-[44px] font-extrabold tracking-tight">0</span><span class="text-[20px] font-semibold m"> / <span id="sumJumlah">0</span></span></p>
          </div>
          <div class="glass rounded-2xl px-3 py-2 text-right flex-none max-w-[48%]">
            <p class="text-[11px] m font-medium">Dikemas kini</p>
            <p id="kemaskini" class="text-[13px] font-semibold">—</p>
          </div>
        </div>
        <div class="mt-4 h-2 rounded-full overflow-hidden" style="background:rgba(255,255,255,.2)">
          <div id="barGuna" class="h-full rounded-full transition-all duration-500" style="width:0%;background:#fff"></div>
        </div>
        <div class="mt-4 grid grid-cols-2 gap-2">
          <div class="glass rounded-2xl px-3 py-2.5 flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl flex items-center justify-center" style="background:rgba(255,255,255,.2)"><i data-lucide="archive" class="w-4 h-4"></i></div>
            <div><p id="sumKotak" class="text-[18px] font-bold leading-none">0</p><p class="text-[11px] m mt-0.5">Tersedia di kotak</p></div>
          </div>
          <div class="glass rounded-2xl px-3 py-2.5 flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl flex items-center justify-center" style="background:rgba(251,191,36,.3)"><i data-lucide="alarm-clock" class="w-4 h-4"></i></div>
            <div><p id="sumLewat" class="text-[18px] font-bold leading-none">0</p><p class="text-[11px] m mt-0.5">Lewat (&gt; 4 jam)</p></div>
          </div>
        </div>
      </div>

      <!-- Penapis status -->
      <div class="flex items-center justify-between gap-2">
        <h2 class="text-[17px] font-bold">Status Kunci</h2>
        <span id="bilBilik" class="text-[12px] muted font-medium"></span>
      </div>
      <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 text-[13px] font-semibold">
        <button data-sf="" class="sfChip chip press px-4 h-9 rounded-full flex-none">Semua</button>
        <button data-sf="Ambil" class="sfChip chip press px-4 h-9 rounded-full flex-none">Digunakan</button>
        <button data-sf="Pulang" class="sfChip chip press px-4 h-9 rounded-full flex-none">Tersedia</button>
      </div>
      <div id="areaStatus"></div>
    </section>

    <!-- ===== Tab: Log ===== -->
    <section id="tabLog" class="hidden space-y-3 pt-1">
      <div class="flex items-center justify-between gap-2">
        <h2 class="text-[17px] font-bold">Log &amp; Sejarah</h2>
        <div class="flex items-center gap-1">
          <span id="bilRekod" class="text-[12px] muted font-medium"></span>
          <button id="resetFilter" class="press h-8 px-2.5 rounded-full muted flex items-center gap-1 text-[12px] font-semibold" aria-label="Set semula penapis"><i data-lucide="filter-x" class="w-4 h-4"></i>Set semula</button>
        </div>
      </div>
      <div id="filterBar" class="hidden space-y-3">
        <div class="flex gap-2">
          <div class="relative flex-1 min-w-0">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 muted"></i>
            <input id="cari" type="search" placeholder="Cari bilik atau guru" class="fld w-full h-11 pl-10 pr-3 rounded-2xl text-[14px]">
          </div>
          <input id="fTarikh" type="date" aria-label="Tapis tarikh" class="fld h-11 w-[138px] px-3 rounded-2xl text-[13px]">
        </div>
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 text-[13px] font-semibold">
          <button data-st="" class="chip stChip press px-4 h-9 rounded-full flex-none">Semua</button>
          <button data-st="Belum Pulang" class="chip stChip press px-4 h-9 rounded-full flex-none">Belum Pulang</button>
          <button data-st="Sudah Pulang" class="chip stChip press px-4 h-9 rounded-full flex-none">Sudah Pulang</button>
        </div>
      </div>
      <div id="area"></div>
      <button id="muatLagi" class="hidden press w-full h-11 rounded-2xl card text-[14px] font-semibold" style="color:var(--brand)">Muat lagi</button>
    </section>
  </main>

  <!-- Navigasi bawah -->
  <nav class="navbar fixed bottom-0 inset-x-0 z-20" style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="max-w-md mx-auto grid grid-cols-3" style="height:var(--nav-h)">
      <button data-tab="status" class="tabBtn nav-item press flex flex-col items-center justify-center gap-1 text-[11px] font-semibold">
        <span class="nav-ic w-14 h-8 rounded-full flex items-center justify-center transition"><i data-lucide="layout-grid" class="w-5 h-5"></i></span>Status
      </button>
      <button data-tab="log" class="tabBtn nav-item press flex flex-col items-center justify-center gap-1 text-[11px] font-semibold">
        <span class="nav-ic w-14 h-8 rounded-full flex items-center justify-center transition"><i data-lucide="history" class="w-5 h-5"></i></span>Log
      </button>
      <button id="navAkaun" class="nav-item press flex flex-col items-center justify-center gap-1 text-[11px] font-semibold">
        <span class="nav-ic w-14 h-8 rounded-full flex items-center justify-center transition"><i data-lucide="circle-user-round" class="w-5 h-5"></i></span>Akaun
      </button>
    </div>
  </nav>
</div>

<!-- ================= Helaian Akaun ================= -->
<div id="sheetAkaun" class="hidden fixed inset-0 z-30 bg-black/40 flex items-end sm:items-center justify-center">
  <div class="sheet-in w-full sm:max-w-md bg-white rounded-t-[28px] sm:rounded-[28px] p-5" style="padding-bottom:max(env(safe-area-inset-bottom),20px)">
    <div class="w-10 h-1.5 rounded-full mx-auto mb-4 sm:hidden" style="background:var(--line)"></div>
    <div class="flex items-center gap-3 mb-5">
      <div id="akAvatar" class="flex-none w-14 h-14 rounded-full btn-on flex items-center justify-center text-[18px] font-bold">?</div>
      <div class="flex-1 min-w-0">
        <p id="akNama" class="text-[17px] font-bold leading-snug break-words line-clamp-3">-</p>
        <p id="akUser" class="text-[13px] muted break-all mt-0.5">-</p>
      </div>
    </div>
    <div class="space-y-2">
      <button id="btnKeluar" class="press w-full h-14 rounded-2xl px-4 flex items-center gap-3 text-[15px] font-semibold" style="background:var(--bad-soft);color:var(--bad)">
        <i data-lucide="log-out" class="w-5 h-5"></i>Log Keluar
      </button>
    </div>
    <button id="tutupAkaun" class="press w-full h-12 mt-3 rounded-2xl text-[15px] font-semibold muted">Tutup</button>
    <p class="tagline text-center text-[11px] muted mt-2 opacity-80"></p>
  </div>
</div>

<!-- ================= Imbasan NFC (tag -> ?kunci=ID) ================= -->
<div id="imbasSheet" class="hidden fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center" style="z-index:35" role="dialog" aria-live="polite">
  <div class="sheet-in w-full sm:max-w-md bg-white rounded-t-[28px] sm:rounded-[28px] p-6 text-center" style="padding-bottom:max(env(safe-area-inset-bottom),24px)">
    <div id="imIkon" class="w-20 h-20 mx-auto rounded-3xl flex items-center justify-center mb-4 t-use"></div>
    <p id="imLabel" class="text-[13px] font-semibold muted"></p>
    <h2 id="imBilik" class="text-[22px] font-extrabold leading-tight mt-1 break-words"></h2>
    <div id="imDetail" class="text-[14px] muted mt-3 space-y-1 break-words"></div>
    <div id="imButang" class="mt-5 space-y-2"></div>
  </div>
</div>

<!-- ================= Skrin Log Masuk / Daftar ================= -->
<div id="authScreen" class="hidden fixed inset-0 z-40 overflow-y-auto" style="background:var(--bg)">
  <div class="auth-top text-white text-center px-6 pb-20" style="padding-top:max(env(safe-area-inset-top),40px)">
    <div class="w-24 h-24 mx-auto rounded-full bg-white flex items-center justify-center shadow-xl mb-4 overflow-hidden">
      <img id="logoSekolah" src="logo.png" alt="Logo SMK Taman Medan" class="w-20 h-20 object-contain"
           onerror="this.classList.add('hidden');document.getElementById('logoGanti').classList.remove('hidden')">
      <div id="logoGanti" class="hidden w-14 h-14 rounded-2xl btn-on flex items-center justify-center"><i data-lucide="key-round" class="w-7 h-7"></i></div>
    </div>
    <h1 class="text-[22px] font-extrabold leading-tight">Pengurusan Kunci</h1>
    <p class="text-[14px] font-medium" style="color:rgba(255,255,255,.8)">SMK Taman Medan</p>
  </div>

  <div class="px-4 -mt-14 pb-8" style="padding-bottom:max(env(safe-area-inset-bottom),32px)">
    <div class="fade card max-w-sm mx-auto rounded-[28px] p-5">
      <div class="soft rounded-2xl p-1 grid grid-cols-2 gap-1 text-[14px] font-semibold mb-5">
        <button type="button" data-auth="login" class="authTab h-10 rounded-xl transition">Log Masuk</button>
        <button type="button" data-auth="daftar" class="authTab h-10 rounded-xl transition">Daftar</button>
      </div>
      <form id="formAuth" class="space-y-4" novalidate>
        <div id="wrapNama" class="hidden">
          <label for="aNama" class="block text-[13px] font-semibold mb-1.5">Nama Penuh <span class="muted font-normal">(dipilih semasa tap tag NFC)</span></label>
          <input id="aNama" type="text" autocomplete="name" maxlength="80" placeholder="cth. Cikgu Ahmad bin Ali" class="fld w-full h-12 px-4 rounded-2xl text-[15px]">
        </div>
        <div>
          <label for="aUser" class="block text-[13px] font-semibold mb-1.5">Nama Pengguna</label>
          <div class="relative">
            <i data-lucide="at-sign" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 muted"></i>
            <input id="aUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="60" placeholder="nama.pengguna" class="fld w-full h-12 pl-11 pr-4 rounded-2xl text-[15px]">
          </div>
        </div>
        <div>
          <label for="aPass" class="block text-[13px] font-semibold mb-1.5">Kata Laluan</label>
          <div class="relative">
            <i data-lucide="lock-keyhole" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 muted"></i>
            <input id="aPass" name="password" type="password" autocomplete="current-password" placeholder="••••••••" class="fld w-full h-12 pl-11 pr-12 rounded-2xl text-[15px]">
            <button type="button" id="lihatPass" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-xl flex items-center justify-center muted" aria-label="Tunjuk kata laluan"><i data-lucide="eye" class="w-[18px] h-[18px]"></i></button>
          </div>
        </div>
        <div id="wrapPass2" class="hidden">
          <label for="aPass2" class="block text-[13px] font-semibold mb-1.5">Sahkan Kata Laluan</label>
          <div class="relative">
            <i data-lucide="lock-keyhole" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 muted"></i>
            <input id="aPass2" type="password" autocomplete="new-password" placeholder="••••••••" class="fld w-full h-12 pl-11 pr-4 rounded-2xl text-[15px]">
          </div>
        </div>
        <label class="flex items-center gap-2.5 text-[14px] font-medium select-none cursor-pointer">
          <input id="aIngat" type="checkbox" checked class="w-5 h-5 rounded accent-blue-700">
          Ingat saya <span class="muted font-normal text-[13px]">(90 hari)</span>
        </label>
        <div id="authMsg" class="hidden text-[13px] px-4 py-3 rounded-2xl" role="alert"></div>
        <button id="btnAuth" type="submit" class="press w-full h-12 rounded-2xl btn-on text-[16px] font-bold disabled:opacity-60">Log Masuk</button>
      </form>
    </div>
    <p class="tagline text-center text-[11px] muted mt-6 opacity-80"></p>
  </div>
</div>

<script>
(function(){
  var LS_DATA = 'kunci_cache', LS_TOKEN = 'kunci_token', LS_USER = 'kunci_user';
  var LS_INGAT = 'kunci_ingat_user'; // nama pengguna sahaja (kata laluan TIDAK disimpan)
  // Supabase: URL projek & kunci publishable/anon (selamat didedahkan; jadual dilindungi RLS, lihat supabase/schema.sql)
  var SUPABASE_URL = 'https://ckbribtplsmipkrlphgj.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_0Xq6i4f-XP0GsA9cMxAHHg_efGmZxHK';
  var KOSONG = { bilik: [], log: [], dijana: '' };
  var VERSI = '1.0';
  var TAGLINE = 'Developed & managed by ustazashraf · v' + VERSI;
  var LEWAT_MS = 4 * 3600 * 1000;
  var LOG_SAIZ = 30;
  var data = KOSONG;
  var sedangMuat = false;
  var tabAktif = 'status', stAktif = '', sfAktif = '';
  var logHad = LOG_SAIZ;

  var $ = function(id){ return document.getElementById(id); };
  // Escape untuk teks DAN atribut HTML (termasuk tanda petikan)
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function icons(){ if (window.lucide) lucide.createIcons(); }
  function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
  function lsSet(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch(e){} }
  function getToken(){ return lsGet(LS_TOKEN); }
  function getUser(){ try { return JSON.parse(lsGet(LS_USER)) || null; } catch(e){ return null; } }

  /* ---------- Panggilan API: fungsi RPC Supabase (satu panggilan = satu tindakan) ---------- */
  var RPC = { daftar: 'api_daftar', login: 'api_login', logout: 'api_logout', getDashboard: 'api_dashboard', imbas: 'api_imbas' };
  function api(body){
    var fn = RPC[body.action];
    if (!fn) return Promise.reject(new Error('Tindakan tidak dikenali'));
    if (!SUPABASE_KEY || SUPABASE_KEY.indexOf('ISI_') === 0) return Promise.reject(new Error('Kunci Supabase belum ditetapkan dalam index.html'));
    return fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ b: body })
    })
      .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
      .then(function(t){
        try { return JSON.parse(t); }
        catch(e){ throw new Error('Respons pelayan bukan JSON. Pastikan supabase/schema.sql telah dijalankan'); }
      });
  }

  /* ---------- Format masa ---------- */
  // Format 12 jam dengan waktu: 8:05 pagi / 12:30 T/hari / 3:15 petang / 9:30 malam
  function waktu(h){ return h < 12 ? 'pagi' : h < 14 ? 'T/hari' : h < 19 ? 'petang' : 'malam'; }
  function hm(d){
    var h = d.getHours();
    return (h % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + waktu(h);
  }
  function sameDay(a,b){ return a.toDateString() === b.toDateString(); }
  function fmtShort(iso){
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return '';
    if (sameDay(d, new Date())) return hm(d);
    return d.toLocaleDateString('ms-MY', { day:'2-digit', month:'short' }) + ' ' + hm(d);
  }
  function fmtDur(iso, sampai){
    var ms = (sampai ? new Date(sampai).getTime() : Date.now()) - new Date(iso).getTime();
    if (!iso || isNaN(ms) || ms < 0) return '-';
    var m = Math.floor(ms/60000), h = Math.floor(m/60), d = Math.floor(h/24);
    if (d > 0) return d + 'h ' + (h%24) + 'j';
    if (h > 0) return h + 'j ' + (m%60) + 'm';
    return m + ' min';
  }
  function localDateStr(iso){
    var d = new Date(iso); if (isNaN(d)) return '';
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function labelHari(iso){
    var d = new Date(iso); if (isNaN(d)) return 'Tanpa tarikh';
    var kini = new Date(), semalam = new Date(); semalam.setDate(kini.getDate() - 1);
    if (sameDay(d, kini)) return 'Hari ini';
    if (sameDay(d, semalam)) return 'Semalam';
    return d.toLocaleDateString('ms-MY', { weekday:'long', day:'numeric', month:'long' });
  }
  function salam(){
    var h = new Date().getHours();
    return h < 12 ? 'Selamat pagi' : h < 14 ? 'Selamat tengah hari' : h < 19 ? 'Selamat petang' : 'Selamat malam';
  }
  function inisial(n){
    var p = String(n || '').replace(/^(cikgu|cg\.?|en\.?|pn\.?|cik|ustaz|ustazah)\s+/i, '').trim().split(/\s+/);
    return ((p[0] || '?')[0] + (p[1] && !/^(bin|binti|bt|b|a\/l|a\/p)$/i.test(p[1]) ? p[1][0] : '')).toUpperCase();
  }
  function lewat(b){ return b.status === 'Ambil' && (Date.now() - new Date(b.masaAmbil).getTime()) >= LEWAT_MS; }

  /* ---------- Muat data ---------- */
  function showWarn(msg){
    var a = $('amaran');
    if (!msg) { a.classList.add('hidden'); return; }
    a.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4 flex-none mt-0.5"></i><span></span>';
    a.lastChild.textContent = msg;
    a.classList.remove('hidden');
    icons();
  }

  async function muat(){
    var token = getToken();
    if (!token) { showAuth(); return; }
    if (sedangMuat) return;
    sedangMuat = true;
    var ic = $('btnRefresh').querySelector('svg'); if (ic) ic.classList.add('spin');
    try {
      var j = await api({ action: 'getDashboard', token: token });
      if (j.auth === false) { logoutLocal(j.error || 'Sesi tamat. Sila log masuk semula.'); return; }
      if (!j.ok || !Array.isArray(j.bilik)) throw new Error(j.error || 'Respons tidak sah');
      data = j;
      lsSet(LS_DATA, JSON.stringify(j));
      showWarn('');
    } catch (err) {
      showWarn('Gagal memuatkan data: ' + err.message + '. Memaparkan data tersimpan.');
    } finally {
      sedangMuat = false;
      var ic2 = $('btnRefresh').querySelector('svg'); if (ic2) ic2.classList.remove('spin');
    }
    render();
  }

  /* ---------- Log masuk / Daftar ---------- */
  var authMode = 'login';
  function authMsg(t, ok){
    var m = $('authMsg');
    if (!t) { m.classList.add('hidden'); return; }
    m.textContent = t;
    m.style.background = ok ? 'var(--ok-soft)' : 'var(--bad-soft)';
    m.style.color = ok ? 'var(--ok)' : 'var(--bad)';
    m.classList.remove('hidden');
  }
  function setAuthMode(m){
    authMode = m;
    var daftar = m === 'daftar';
    $('wrapNama').classList.toggle('hidden', !daftar);
    $('wrapPass2').classList.toggle('hidden', !daftar);
    $('aPass').setAttribute('autocomplete', daftar ? 'new-password' : 'current-password');
    $('btnAuth').textContent = daftar ? 'Daftar Akaun' : 'Log Masuk';
    document.querySelectorAll('.authTab').forEach(function(b){
      b.className = 'authTab h-10 rounded-xl transition ' + (b.dataset.auth === m ? 'bg-white shadow-sm' : 'muted');
    });
    authMsg('');
  }
  function showAuth(msg, ok){
    var diingat = lsGet(LS_INGAT);
    if (diingat && !$('aUser').value) $('aUser').value = diingat;
    $('authScreen').classList.remove('hidden');
    if (msg) authMsg(msg, ok);
    icons();
  }
  function hideAuth(){ $('authScreen').classList.add('hidden'); authMsg(''); }
  function logoutLocal(msg, ok){
    lsSet(LS_TOKEN, ''); lsSet(LS_USER, ''); lsSet(LS_DATA, '');
    data = KOSONG; showWarn(''); tutupAkaun(); render();
    setAuthMode('login');
    showAuth(msg, ok);
  }
  document.querySelectorAll('.authTab').forEach(function(b){ b.onclick = function(){ setAuthMode(b.dataset.auth); }; });
  $('lihatPass').onclick = function(){
    var t = $('aPass').type === 'password' ? 'text' : 'password';
    $('aPass').type = t; $('aPass2').type = t;
    this.innerHTML = '<i data-lucide="' + (t === 'text' ? 'eye-off' : 'eye') + '" class="w-[18px] h-[18px]"></i>';
    icons();
  };
  $('formAuth').addEventListener('submit', async function(e){
    e.preventDefault();
    var u = $('aUser').value.trim(), p = $('aPass').value, n = $('aNama').value.trim();
    if (!u || !p) return authMsg('Sila isi nama pengguna dan kata laluan.');
    if (authMode === 'daftar') {
      if (!n) return authMsg('Sila isi nama penuh.');
      if (!/^[a-zA-Z0-9._@-]{3,60}$/.test(u)) return authMsg('Nama pengguna mesti 3-60 aksara (huruf, nombor, . _ @ -).');
      if (p.length < 8) return authMsg('Kata laluan mesti sekurang-kurangnya 8 aksara.');
      if (p !== $('aPass2').value) return authMsg('Pengesahan kata laluan tidak sepadan.');
    }
    var btn = $('btnAuth'), asal = btn.textContent;
    var ingat = $('aIngat').checked;
    btn.disabled = true; btn.textContent = 'Memproses...';
    try {
      var daftar = authMode === 'daftar';
      var j = daftar
        ? await api({ action: 'daftar', username: u, nama: n, password: p, ingat: ingat })
        : await api({ action: 'login', username: u, password: p, ingat: ingat });
      if (!j.ok || !j.token) throw new Error(j.error || (daftar ? 'Pendaftaran gagal' : 'Log masuk gagal'));
      // Daftar & log masuk: terus masuk ke dashboard
      lsSet(LS_TOKEN, j.token);
      lsSet(LS_USER, JSON.stringify(j.pengguna || { username: u }));
      lsSet(LS_INGAT, ingat ? u : '');
      // Minta pelayar menawarkan "Simpan kata laluan" (disimpan tersulit oleh pelayar, bukan localStorage)
      if (ingat && window.PasswordCredential && navigator.credentials) {
        try { navigator.credentials.store(new PasswordCredential({ id: u, password: p, name: (j.pengguna && j.pengguna.nama) || u })).catch(function(){}); } catch(e){}
      }
      $('aPass').value = ''; $('aPass2').value = ''; $('aNama').value = '';
      setAuthMode('login');
      hideAuth();
      render();
      // Datang dari tag NFC sebelum log masuk: teruskan rekod kunci itu
      if (kunciTertunda) { var k = kunciTertunda; kunciTertunda = ''; imbas(k); }
      else muat();
    } catch (err) {
      authMsg(err.message);
    } finally {
      btn.disabled = false;
      if (btn.textContent === 'Memproses...') btn.textContent = asal;
    }
  });

  /* ---------- Akaun ---------- */
  function bukaAkaun(){
    var u = getUser() || {};
    $('akNama').textContent = u.nama || u.username || '-';
    $('akUser').textContent = u.username ? '@' + u.username : '';
    $('akAvatar').textContent = inisial(u.nama || u.username);
    $('sheetAkaun').classList.remove('hidden');
    icons();
  }
  function tutupAkaun(){ $('sheetAkaun').classList.add('hidden'); }
  $('btnAvatar').onclick = bukaAkaun;
  $('navAkaun').onclick = bukaAkaun;
  $('tutupAkaun').onclick = tutupAkaun;
  $('sheetAkaun').addEventListener('click', function(e){ if (e.target === this) tutupAkaun(); });
  $('btnKeluar').onclick = function(){
    var t = getToken();
    if (t) api({ action: 'logout', token: t }).catch(function(){});
    logoutLocal('Anda telah log keluar.', true);
  };

  /* ---------- Imbasan NFC: tag menghala ke laman ini dengan ?kunci=ID ---------- */
  // Satu panggilan API sahaja = jauh lebih pantas.
  var kunciTertunda = '';
  function namaBilik(k){
    var K = String(k).trim().toUpperCase();
    var b = data.bilik.filter(function(x){ return String(x.idKunci).toUpperCase() === K; })[0];
    return b ? b.nama : '';
  }
  function paparImbas(o){
    var ik = $('imIkon');
    ik.className = 'w-20 h-20 mx-auto rounded-3xl flex items-center justify-center mb-4 ' + o.nada;
    ik.innerHTML = '<i data-lucide="' + o.ikon + '" class="w-10 h-10' + (o.pusing ? ' spin' : '') + '"></i>';
    $('imLabel').textContent = o.label;
    $('imBilik').textContent = o.bilik;
    $('imDetail').innerHTML = o.detail || '';
    $('imButang').innerHTML = o.butang || '';
    $('imbasSheet').classList.remove('hidden');
    icons();
  }
  function tutupImbas(){ $('imbasSheet').classList.add('hidden'); }
  var BTN_SELESAI = '<button type="button" data-im="tutup" class="press w-full h-12 rounded-2xl btn-on text-[15px] font-bold">Selesai</button>';
  async function imbas(k){
    if (!getToken()) {
      kunciTertunda = k; tutupImbas();
      setAuthMode('login');
      showAuth('Log masuk untuk merekod kunci ' + (namaBilik(k) || k) + '.', true);
      return;
    }
    $('imButang').dataset.kunci = k;
    paparImbas({ ikon: 'loader-circle', pusing: true, nada: 't-use', label: 'Merekod kunci…', bilik: namaBilik(k) || k });
    try {
      var j = await api({ action: 'imbas', kunci: k, token: getToken() });
      if (j.auth === false) {
        tutupImbas();
        logoutLocal(j.error || 'Sesi tamat. Sila log masuk semula.');
        kunciTertunda = k; // selepas log masuk, kunci ini direkod
        return;
      }
      if (!j.ok) throw new Error(j.error || 'Rekod gagal');
      var ambil = j.tindakan === 'Ambil';
      try { if (navigator.vibrate) navigator.vibrate(ambil ? 80 : [50, 60, 50]); } catch(e){}
      paparImbas({
        ikon: ambil ? 'key-round' : 'circle-check',
        nada: ambil ? 't-use' : 't-ok',
        label: ambil ? 'Kunci DIAMBIL' : 'Kunci DIPULANGKAN',
        bilik: j.bilik,
        detail:
          '<p class="flex items-center justify-center gap-1.5"><i data-lucide="user-round" class="w-4 h-4 flex-none"></i><span>' + esc(j.guru) + '</span></p>' +
          '<p class="flex items-center justify-center gap-1.5"><i data-lucide="clock-3" class="w-4 h-4 flex-none"></i><span>' + esc(j.masa) + '</span></p>' +
          (j.ulang ? '<p class="text-[12.5px] mt-3 px-3 py-2 rounded-xl soft">Imbasan berulang: rekod tadi dipaparkan, tiada rekod baharu.</p>' : '') +
          (ambil && !j.ulang ? '<p class="text-[12.5px] mt-3">Tap tag yang sama apabila memulangkan kunci.</p>' : ''),
        butang: BTN_SELESAI
      });
    } catch (err) {
      paparImbas({
        ikon: 'triangle-alert', nada: 't-bad', label: 'Gagal merekod', bilik: namaBilik(k) || k,
        detail: '<p>' + esc(err.message) + '</p>',
        butang: '<button type="button" data-im="ulang" class="press w-full h-12 rounded-2xl btn-on text-[15px] font-bold">Cuba lagi</button>' +
                '<button type="button" data-im="tutup" class="press w-full h-12 rounded-2xl soft text-[15px] font-semibold">Tutup</button>'
      });
    }
    muat(); // dashboard terus menunjukkan status terkini
  }
  $('imButang').addEventListener('click', function(e){
    var b = e.target.closest('[data-im]');
    if (!b) return;
    if (b.dataset.im === 'ulang') imbas(this.dataset.kunci);
    else tutupImbas();
  });

  /* ---------- Render ---------- */
  function render(){
    var luar = data.bilik.filter(function(b){ return b.status === 'Ambil'; }).length;
    var nLewat = data.bilik.filter(lewat).length;
    var jumlah = data.bilik.length;
    $('sumJumlah').textContent = jumlah;
    $('sumLuar').textContent = luar;
    $('sumKotak').textContent = jumlah - luar;
    $('sumLewat').textContent = nLewat;
    $('barGuna').style.width = (jumlah ? Math.round(luar / jumlah * 100) : 0) + '%';
    $('kemaskini').textContent = data.dijana ? fmtShort(data.dijana) : '—';
    var u = getUser();
    var nama = u && (u.nama || u.username);
    var pendek = nama ? String(nama).split(/\s+(?:bin|binti|bt|b\.|a\/l|a\/p)\s+/i)[0] : '';
    $('salam').textContent = salam() + (pendek ? ',' : '');
    $('namaSalam').textContent = pendek;
    $('namaSalam').title = nama || '';
    $('btnAvatar').textContent = inisial(nama);
    renderStatus();
    renderLog();
  }

  function empty(ikon, tajuk, sub){
    return '<div class="card rounded-3xl py-12 px-6 flex flex-col items-center text-center gap-2">' +
      '<div class="w-14 h-14 rounded-2xl soft flex items-center justify-center muted mb-1"><i data-lucide="' + ikon + '" class="w-7 h-7"></i></div>' +
      '<p class="text-[15px] font-semibold">' + tajuk + '</p>' + (sub ? '<p class="text-[13px] muted">' + sub + '</p>' : '') + '</div>';
  }

  function renderStatus(){
    var list = data.bilik.slice().sort(function(a,b){
      var la = lewat(a), lb = lewat(b);
      if (la !== lb) return la ? -1 : 1;
      if (a.status !== b.status) return a.status === 'Ambil' ? -1 : 1;
      return String(a.nama).localeCompare(String(b.nama));
    });
    if (sfAktif) list = list.filter(function(b){ return b.status === sfAktif; });
    $('bilBilik').textContent = data.bilik.length + ' bilik';
    $('areaStatus').innerHTML = list.length
      ? '<div class="grid grid-cols-1 gap-2.5 sm:grid-cols-2 fade">' + list.map(roomCard).join('') + '</div>'
      : (data.bilik.length ? empty('search-x', 'Tiada kunci dalam kategori ini') : empty('key-round', 'Tiada data bilik', 'Tarik data dengan butang muat semula.'));
    icons();
  }

  function roomCard(b){
    var guna = b.status === 'Ambil', lw = lewat(b);
    var tile = lw ? 't-warn' : guna ? 't-use' : 't-ok';
    var ikon = lw ? 'alarm-clock' : guna ? 'key-round' : 'archive';
    var pill = lw ? '<span class="pill t-warn">Lewat · ' + fmtDur(b.masaAmbil) + '</span>'
             : guna ? '<span class="pill t-use">' + fmtDur(b.masaAmbil) + '</span>'
             : '<span class="pill t-ok">Tersedia</span>';
    var nama = '<span class="text-[15px] font-semibold leading-snug line-clamp-2 break-words min-w-0" title="' + esc(b.nama) + '">' + esc(b.nama) + '</span>';
    var kepala, badan;
    if (guna) {
      // Kunci digunakan: nama bilik & pemegang guna lebar penuh; tempoh di baris "Diambil"
      kepala = '<div class="flex items-center gap-1.5 min-w-0">' + nama +
        '<span class="w-1.5 h-1.5 rounded-full pulse-dot flex-none" style="background:' + (lw ? 'var(--warn)' : 'var(--brand)') + '"></span></div>';
      badan =
        '<div class="text-[12.5px] muted flex items-start gap-1 mt-0.5 min-w-0"><i data-lucide="user-round" class="w-3.5 h-3.5 flex-none mt-[2px]"></i>' +
          '<span class="pemegang line-clamp-2 break-words min-w-0" title="' + esc(b.pemegang) + '">' + esc(b.pemegang) + '</span></div>' +
        '<div class="mt-1.5 flex flex-wrap items-center justify-between gap-x-2 gap-y-1 min-w-0">' +
          '<span class="text-[12px] muted flex items-center gap-1 whitespace-nowrap"><i data-lucide="clock-3" class="w-3.5 h-3.5 flex-none"></i>Diambil ' + fmtShort(b.masaAmbil) + '</span>' + pill + '</div>';
    } else {
      kepala = '<div class="flex items-center justify-between gap-2 min-w-0">' + nama + pill + '</div>';
      badan = '<div class="text-[12.5px] muted flex items-center gap-1 mt-0.5 min-w-0"><i data-lucide="check" class="w-3.5 h-3.5 flex-none"></i><span class="truncate min-w-0">Di dalam kotak kunci</span></div>';
    }
    return '<div class="kad card rounded-2xl p-3 flex items-start gap-3 min-w-0 overflow-hidden" data-status="' + (guna ? 'Ambil' : 'Pulang') + '">' +
      '<div class="w-12 h-12 rounded-2xl flex items-center justify-center flex-none ' + tile + '"><i data-lucide="' + ikon + '" class="w-[22px] h-[22px]"></i></div>' +
      '<div class="flex-1 min-w-0">' + kepala + badan + '</div></div>';
  }

  function filteredLog(){
    var q = $('cari').value.trim().toLowerCase();
    var tarikh = $('fTarikh').value;
    return data.log.filter(function(r){
      if (stAktif && r.status !== stAktif) return false;
      if (tarikh) {
        var t1 = r.masaAmbil ? localDateStr(r.masaAmbil) : '', t2 = r.masaPulang ? localDateStr(r.masaPulang) : '';
        if (t1 !== tarikh && t2 !== tarikh) return false;
      }
      if (q && (r.bilik + ' ' + r.guru + ' ' + r.idKunci).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function renderLog(){
    var rows = filteredLog();
    $('bilRekod').textContent = rows.length + ' rekod';
    var shown = rows.slice(0, logHad);
    var html = '', hariLepas = null;
    shown.forEach(function(r){
      var h = labelHari(r.masaAmbil || r.masaPulang);
      if (h !== hariLepas) {
        if (hariLepas !== null) html += '</div>';
        html += '<p class="text-[12px] font-semibold muted uppercase tracking-wide px-1 pt-2 pb-1.5">' + esc(h) + '</p><div class="card rounded-2xl overflow-hidden divide-y" style="border-color:var(--line)">';
        hariLepas = h;
      }
      html += logRow(r);
    });
    if (hariLepas !== null) html += '</div>';
    // Pelayan hanya menghantar rekod terkini; maklumkan apabila semua yang dihantar sudah dipapar
    if (shown.length && rows.length <= logHad && data.jumlahLog > data.log.length) {
      html += '<p id="notaLog" class="text-center text-[12px] muted pt-3">Memaparkan ' + data.log.length + ' rekod terkini daripada ' +
        data.jumlahLog + '. Rekod lebih lama ada dalam tab Log_Imbas.</p>';
    }
    $('area').innerHTML = shown.length ? '<div class="fade">' + html + '</div>'
      : empty('history', 'Tiada rekod sepadan', data.log.length ? 'Cuba ubah carian atau penapis.' : '');
    $('muatLagi').classList.toggle('hidden', rows.length <= logHad);
    icons();
  }

  // Dalam log yang dikumpul ikut hari: jam sahaja jika sama hari dengan kumpulan, jika tidak sertakan tarikh
  function jam(iso, rujukan){
    if (!iso) return '-';
    var d = new Date(iso), r = new Date(rujukan || iso);
    if (isNaN(d)) return '-';
    return sameDay(d, r) ? hm(d) : d.toLocaleDateString('ms-MY', { day:'numeric', month:'short' }) + ' ' + hm(d);
  }

  function logRow(r){
    var belum = r.status === 'Belum Pulang';
    var ruj = r.masaAmbil || r.masaPulang;
    var pulang = belum
      ? '<span class="pill t-use">Belum pulang</span>'
      : '<span class="text-[12px] muted">' + (r.masaAmbil ? fmtDur(r.masaAmbil, r.masaPulang) : '') + '</span>';
    return '<div class="px-3.5 py-3 flex items-center gap-3 min-w-0" style="border-color:var(--line)">' +
      '<div class="w-10 h-10 rounded-xl flex items-center justify-center flex-none ' + (belum ? 't-use' : 't-ok') + '"><i data-lucide="' + (belum ? 'log-out' : 'log-in') + '" class="w-[18px] h-[18px]"></i></div>' +
      '<div class="flex-1 min-w-0">' +
        '<div class="text-[14px] font-semibold leading-snug line-clamp-2 break-words" title="' + esc(r.bilik) + '">' + esc(r.bilik) + '</div>' +
        '<div class="text-[12.5px] muted line-clamp-2 break-words" title="' + esc(r.guru) + '">' + esc(r.guru) + '</div>' +
        '<div class="text-[12px] mt-0.5 flex flex-wrap items-center gap-x-1 muted"><span class="whitespace-nowrap">Ambil ' + jam(r.masaAmbil, ruj) + '</span>' +
          (belum ? '' : '<i data-lucide="arrow-right" class="w-3 h-3 flex-none"></i><span class="whitespace-nowrap">Pulang ' + jam(r.masaPulang, ruj) + '</span>') + '</div>' +
      '</div>' + pulang + '</div>';
  }

  /* ---------- Tab & penapis ---------- */
  function styleTabs(){
    document.querySelectorAll('.tabBtn').forEach(function(b){ b.classList.toggle('on', b.dataset.tab === tabAktif); });
    document.querySelectorAll('.stChip').forEach(function(c){ c.classList.toggle('on', c.dataset.st === stAktif); });
    document.querySelectorAll('.sfChip').forEach(function(c){ c.classList.toggle('on', c.dataset.sf === sfAktif); });
  }
  function setTab(t){
    tabAktif = t;
    $('tabStatus').classList.toggle('hidden', t !== 'status');
    $('tabLog').classList.toggle('hidden', t !== 'log');
    $('filterBar').classList.toggle('hidden', t !== 'log');
    styleTabs();
    window.scrollTo(0, 0);
    if (t === 'log') renderLog(); else renderStatus();
  }
  function semulaLog(){ logHad = LOG_SAIZ; renderLog(); }
  document.querySelectorAll('.tabBtn').forEach(function(b){ b.onclick = function(){ setTab(b.dataset.tab); }; });
  document.querySelectorAll('.stChip').forEach(function(c){ c.onclick = function(){ stAktif = c.dataset.st; styleTabs(); semulaLog(); }; });
  document.querySelectorAll('.sfChip').forEach(function(c){ c.onclick = function(){ sfAktif = c.dataset.sf; styleTabs(); renderStatus(); }; });
  ['cari','fTarikh'].forEach(function(id){ $(id).addEventListener('input', semulaLog); });
  $('resetFilter').onclick = function(){ $('cari').value=''; $('fTarikh').value=''; stAktif=''; styleTabs(); semulaLog(); };
  $('muatLagi').onclick = function(){ logHad += LOG_SAIZ; renderLog(); };

  $('btnRefresh').onclick = muat;

  /* ---------- Auto-refresh 30 saat ---------- */
  setInterval(function(){ if (!document.hidden && getToken()) muat(); }, 30000);
  setInterval(function(){ if (!document.hidden) render(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && getToken()) muat(); });

  /* ---------- Mula ---------- */
  document.querySelectorAll('.tagline').forEach(function(el){ el.textContent = TAGLINE; });
  setAuthMode('login');
  if (getToken()) {
    try { var c = JSON.parse(lsGet(LS_DATA)); if (c && Array.isArray(c.bilik)) data = c; } catch(e){}
  }
  styleTabs(); icons();
  render();
  // Dibuka dari tag NFC: buang ?kunci= dari URL (muat semula tidak merekod lagi), kemudian rekod
  var kunciUrl = '';
  try { kunciUrl = (new URLSearchParams(location.search).get('kunci') || '').trim().slice(0, 80); } catch(e){}
  if (kunciUrl) { try { history.replaceState(null, '', location.pathname + location.hash); } catch(e){} }
  if (kunciUrl) imbas(kunciUrl);
  else if (getToken()) muat(); else showAuth();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
